<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04060F" />
<meta name="description" content="Маленький мир, созданный специально для тебя" />
<title>мур~</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --night-deep: #04060F;
  --night: #070B1A;
  --night-soft: #0D1330;
  --blush: #F9A8D4;
  --blush-soft: #FBCFE8;
  --lavender: #C4B5FD;
  --lavender-soft: #DDD6FE;
  --star: #FFF7ED;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Manrope", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--sans);
  color: #EDE9FE;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(196,181,253,0.07), transparent 60%),
    radial-gradient(1000px 500px at 10% 110%, rgba(249,168,212,0.06), transparent 60%),
    var(--night-deep);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
::selection { background: rgba(249,168,212,0.35); color: #fff; }
:focus-visible { outline: 2px solid rgba(249,168,212,0.8); outline-offset: 3px; border-radius: 8px; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #04060f; }
::-webkit-scrollbar-thumb { background: rgba(196,181,253,0.25); border-radius: 8px; }

/* ── Утилиты ─────────────────────────────────────────────── */
.glass {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 40px rgba(4,6,15,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
}
.text-glow {
  text-shadow: 0 0 24px rgba(249,168,212,0.45), 0 0 60px rgba(196,181,253,0.25);
}
.eyebrow {
  font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase;
  color: rgba(249,168,212,0.8); margin: 0 0 12px;
}
.section { position: relative; z-index: 10; padding: 96px 24px; max-width: 1152px; margin: 0 auto; }
@media (min-width: 768px) { .section { padding: 128px 24px; } }
.section-title {
  font-family: var(--serif); font-weight: 500; color: #fff;
  font-size: clamp(28px, 5vw, 48px); margin: 0; text-align: center;
}
.title-rule {
  width: 96px; height: 1px; margin: 20px auto 0;
  background: linear-gradient(90deg, transparent, rgba(249,168,212,0.7), transparent);
}
.section-head { text-align: center; margin-bottom: 48px; }
@media (min-width: 768px) { .section-head { margin-bottom: 64px; } }

/* Появление при прокрутке */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1); }
.reveal.visible { opacity: 1; transform: none; }

/* Звёздное небо */
.starfield { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* Парящие сердечки */
.float-heart {
  position: fixed; bottom: -40px; color: var(--blush); opacity: 0;
  pointer-events: none; z-index: 0;
  animation: float-heart linear infinite;
}
@keyframes float-heart {
  0%   { transform: translateY(0) rotate(-4deg); opacity: 0; }
  15%  { opacity: 0.16; }
  85%  { opacity: 0.1; }
  100% { transform: translateY(-48vh) rotate(6deg); opacity: 0; }
}

/* ── Вступление ──────────────────────────────────────────── */
#intro {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: var(--night-deep);
  transition: opacity 0.9s ease;
}
#intro.leaving { opacity: 0; pointer-events: none; }
#intro::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 35%, rgba(4,6,15,0.85) 100%);
}
.intro-inner { position: relative; z-index: 2; max-width: 640px; padding: 0 24px; text-align: center; }
.intro-line1 {
  font-family: var(--serif); font-size: clamp(24px, 4.5vw, 42px); line-height: 1.25;
  color: #F5F3FF; margin: 0;
  opacity: 0; transform: translateY(18px); filter: blur(6px);
  transition: opacity 1.2s cubic-bezier(0.22,1,0.36,1), transform 1.2s cubic-bezier(0.22,1,0.36,1), filter 1.2s;
}
.intro-line1.shown { opacity: 1; transform: none; filter: blur(0); }
.intro-line2 {
  font-size: clamp(15px, 2.5vw, 18px); line-height: 1.65; color: rgba(221,214,254,0.9);
  margin: 24px auto 0; max-width: 520px;
  opacity: 0; transform: translateY(16px);
  transition: opacity 1s ease, transform 1s ease;
}
.intro-line2.shown { opacity: 1; transform: none; }
.intro-cta {
  margin-top: 40px; display: inline-flex; align-items: center; gap: 10px;
  border-radius: 999px; padding: 14px 32px;
  font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: #fff;
  background: linear-gradient(90deg, rgba(249,168,212,0.2), rgba(196,181,253,0.2), rgba(249,168,212,0.2));
  border: 1px solid rgba(249,168,212,0.4);
  box-shadow: 0 0 40px rgba(249,168,212,0.25);
  transition: opacity 0.6s, transform 0.6s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s, border-color 0.3s;
  opacity: 0; transform: translateY(14px) scale(0.96); pointer-events: none;
}
.intro-cta.shown { opacity: 1; transform: none; pointer-events: auto; }
.intro-cta:hover { box-shadow: 0 0 60px rgba(249,168,212,0.4); border-color: rgba(249,168,212,0.7); }
.intro-skip {
  position: absolute; bottom: 20px; right: 20px; z-index: 3;
  background: none; border: none; border-radius: 999px; padding: 8px 16px;
  font-size: 12px; letter-spacing: 0.03em; color: rgba(196,181,253,0.5);
  transition: color 0.2s;
}
.intro-skip:hover { color: rgba(237,233,254,1); }

/* ── Главный экран ───────────────────────────────────────── */
.hero {
  position: relative; z-index: 10; min-height: 100svh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 96px 24px; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at bottom, rgba(196,181,253,0.1), transparent 55%);
}
.hero-inner { position: relative; z-index: 2; max-width: 780px; }
.hero h1 {
  font-family: var(--serif); font-weight: 500; color: #fff;
  font-size: clamp(30px, 6vw, 64px); line-height: 1.15; margin: 16px 0 0;
}
.hero .subtitle { margin: 24px auto 0; max-width: 560px; font-size: 15px; line-height: 1.7; color: rgba(221,214,254,0.85); }
.connected-stars { margin-top: 40px; width: 100%; max-width: 560px; }
.greeting {
  margin: 48px auto 0; max-width: 560px; border-radius: 24px; padding: 24px 28px;
  font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.6; color: #EDE9FE;
}
.greeting .sparkle { color: var(--lavender); font-size: 20px; }
.scroll-hint {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  z-index: 2; color: rgba(196,181,253,0.6); text-decoration: none; font-size: 24px;
  animation: hint-bounce 2s ease-in-out infinite;
}
@keyframes hint-bounce { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,8px); } }

/* SVG-анимации звёзд */
.star-core { animation: star-pulse 3.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
.star-core.delay { animation-delay: 1.7s; }
@keyframes star-pulse { 0%,100% { opacity: 0.75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
.thread-dash { animation: dash-move 7s linear infinite; }
@keyframes dash-move { to { stroke-dashoffset: -40; } }
.twinkle { animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
.twinkle.d1 { animation-delay: 0.7s; } .twinkle.d2 { animation-delay: 1.4s; }
.twinkle.d3 { animation-delay: 0.4s; } .twinkle.d4 { animation-delay: 1.1s; }
.twinkle.d5 { animation-delay: 1.8s; } .twinkle.d6 { animation-delay: 0.9s; }

/* ── Карточки «Почему именно ты» ─────────────────────────── */
.grid-cards { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid-cards { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .grid-cards { grid-template-columns: repeat(3, 1fr); } }
.card {
  position: relative; border-radius: 24px; padding: 24px; text-align: left; color: inherit;
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), border-color 0.3s, box-shadow 0.3s;
}
.card:hover { transform: translateY(-6px); border-color: rgba(249,168,212,0.4); }
.card-icon {
  display: inline-flex; width: 40px; height: 40px; align-items: center; justify-content: center;
  border-radius: 999px; border: 1px solid rgba(249,168,212,0.3); background: rgba(249,168,212,0.1);
  font-size: 16px; margin-bottom: 16px;
}
.card h3 { font-family: var(--serif); font-weight: 500; font-size: 20px; line-height: 1.35; color: #fff; margin: 0; }
.card .detail {
  overflow: hidden; max-height: 0; opacity: 0;
  transition: max-height 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.35s, margin 0.4s;
  font-size: 14px; line-height: 1.65; color: rgba(221,214,254,0.85);
  border-top: 1px solid transparent;
}
.card.open .detail { max-height: 220px; opacity: 1; margin-top: 12px; border-top-color: rgba(255,255,255,0.1); padding-top: 12px; }
.card .hint { display: block; margin-top: auto; padding-top: 16px; font-size: 12px; letter-spacing: 0.03em; color: rgba(196,181,253,0.5); transition: color 0.2s; }
.card:hover .hint { color: rgba(249,168,212,0.8); }
.card { display: flex; flex-direction: column; height: 100%; }

/* ── История (таймлайн) ──────────────────────────────────── */
.timeline { position: relative; max-width: 896px; margin: 0 auto; }
.timeline::before {
  content: ""; position: absolute; left: 16px; top: 8px; bottom: 8px; width: 1px;
  background: linear-gradient(180deg, rgba(249,168,212,0.6), rgba(196,181,253,0.4), transparent);
}
@media (min-width: 768px) { .timeline::before { left: 50%; } }
.tl-item { position: relative; padding-left: 48px; margin-bottom: 32px; }
@media (min-width: 768px) {
  .tl-item { padding-left: 0; width: 50%; }
  .tl-item:nth-child(odd) { margin-left: auto; padding-left: 48px; }
  .tl-item:nth-child(even) { padding-right: 48px; text-align: right; }
}
.tl-dot {
  position: absolute; left: 16px; top: 26px; width: 10px; height: 10px;
  transform: translateX(-50%); border-radius: 999px; background: var(--blush);
  box-shadow: 0 0 16px rgba(249,168,212,0.9);
}
@media (min-width: 768px) { .tl-dot { left: 50%; } }
.tl-card { width: 100%; border-radius: 24px; padding: 24px; color: inherit; text-align: left; transition: transform 0.3s, border-color 0.3s; }
.tl-card:hover { transform: translateY(-4px); border-color: rgba(196,181,253,0.4); }
@media (min-width: 768px) { .tl-item:nth-child(even) .tl-card { text-align: right; } }
.tl-date { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(196,181,253,0.7); margin: 0 0 8px; }
@media (min-width: 768px) { .tl-item:nth-child(even) .tl-date { justify-content: flex-end; } }
.tl-card h3 { font-family: var(--serif); font-weight: 500; font-size: 22px; color: #fff; margin: 0 0 8px; }
.tl-card p { margin: 0; font-size: 14px; line-height: 1.6; color: rgba(221,214,254,0.7); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-more { display: block; margin-top: 14px; font-size: 12px; color: rgba(249,168,212,0.7); opacity: 0; transition: opacity 0.2s; }
.tl-card:hover .tl-more { opacity: 1; }

/* ── Письма ──────────────────────────────────────────────── */
.letter-card { overflow: hidden; }
.letter-card::before {
  content: ""; position: absolute; right: -32px; top: -32px; width: 112px; height: 112px;
  border-radius: 999px; background: rgba(249,168,212,0.1); filter: blur(32px);
  transition: background 0.3s;
}
.letter-card:hover::before { background: rgba(249,168,212,0.2); }
.letter-emoji {
  display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center;
  border-radius: 16px; border: 1px solid rgba(196,181,253,0.3); background: rgba(196,181,253,0.1);
  font-size: 22px; margin-bottom: 20px;
}
.seal { display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 16px; border: 1px solid rgba(249,168,212,0.3); background: rgba(249,168,212,0.1); font-size: 22px; margin-bottom: 20px; }
.letter-body { border-left: 2px solid rgba(249,168,212,0.3); padding-left: 16px; margin-top: 20px; }
.letter-body p { margin: 0 0 16px; font-size: 15px; line-height: 1.7; color: rgba(237,233,254,0.9); }
.letter-body p:last-child { margin-bottom: 0; }
.letter-sign { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 24px; font-family: var(--serif); font-style: italic; font-size: 18px; color: rgba(249,168,212,0.9); }

/* ── Модальное окно ──────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: rgba(4,6,15,0.85); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  position: relative; width: 100%; max-width: 512px; max-height: 85vh; overflow-y: auto;
  border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(13,19,48,0.97); padding: 28px 32px;
  box-shadow: 0 24px 80px rgba(4,6,15,0.6), 0 0 60px rgba(249,168,212,0.08);
  transform: translateY(24px) scale(0.96); transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
}
.modal-overlay.open .modal { transform: none; }
.modal-close {
  position: absolute; top: 14px; right: 14px; width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
  color: rgba(196,181,253,0.8); font-size: 15px; transition: background 0.2s, color 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
.modal .m-eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(196,181,253,0.7); margin: 0 0 6px; }
.modal h3 { font-family: var(--serif); font-weight: 500; font-size: 26px; color: #fff; margin: 0 0 18px; }
.modal .m-text { font-size: 15px; line-height: 1.7; color: rgba(237,233,254,0.9); }
.photo-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  height: 160px; margin-bottom: 20px; border-radius: 16px;
  border: 1px dashed rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
  color: rgba(196,181,253,0.5); font-size: 12px; text-align: center; padding: 0 16px;
}
.photo-placeholder .ph-icon { font-size: 22px; }
.modal img.m-photo { width: 100%; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; object-fit: cover; }

/* ── Сюрприз ─────────────────────────────────────────────── */
.secret-wrap { text-align: center; padding: 96px 24px; position: relative; z-index: 10; }
@media (min-width: 768px) { .secret-wrap { padding: 128px 24px; } }
.secret-btn {
  display: inline-flex; align-items: center; gap: 12px; border-radius: 999px;
  padding: 18px 40px; font-family: var(--serif); font-size: clamp(19px, 3vw, 24px); color: #fff;
  background: linear-gradient(90deg, rgba(196,181,253,0.15), rgba(249,168,212,0.15), rgba(196,181,253,0.15));
  border: 1px solid rgba(196,181,253,0.4);
  box-shadow: 0 0 50px rgba(196,181,253,0.2);
  transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.secret-btn:hover { transform: scale(1.03); box-shadow: 0 0 70px rgba(249,168,212,0.35); border-color: rgba(196,181,253,0.7); }
.surprise-overlay {
  position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center;
  background: rgba(4,6,15,0.95); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity 0.5s; overflow: hidden; padding: 24px;
}
.surprise-overlay.open { opacity: 1; pointer-events: auto; }
.surprise-content { position: relative; z-index: 5; max-width: 560px; text-align: center; opacity: 0; transform: translateY(30px) scale(0.95); transition: opacity 0.9s 0.5s, transform 0.9s 0.5s cubic-bezier(0.22,1,0.36,1); }
.surprise-overlay.open .surprise-content { opacity: 1; transform: none; }
.surprise-content .s-heart { font-size: 30px; display: block; margin-bottom: 24px; filter: drop-shadow(0 0 20px rgba(249,168,212,0.7)); }
.surprise-content p.msg { font-family: var(--serif); font-size: clamp(22px, 4vw, 30px); line-height: 1.45; color: #fff; margin: 0; }
.surprise-content p.sign { font-family: var(--serif); font-style: italic; font-size: 19px; color: rgba(196,181,253,0.9); margin: 24px 0 0; }
.surprise-back {
  margin-top: 40px; border-radius: 999px; padding: 11px 24px; font-size: 14px;
  border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: rgba(221,214,254,0.8);
  transition: border-color 0.2s, color 0.2s;
}
.surprise-back:hover { border-color: rgba(249,168,212,0.5); color: #fff; }
.particle { position: absolute; border-radius: 999px; pointer-events: none; }
.p-heart { position: absolute; color: var(--blush); pointer-events: none; }

/* ── Расстояние ──────────────────────────────────────────── */
.distance-svg { display: block; margin: 0 auto; width: 100%; max-width: 640px; }
.distance-note { max-width: 440px; margin: 32px auto 0; font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.55; color: rgba(237,233,254,0.9); text-align: center; }
.countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 440px; margin: 40px auto 0; border-radius: 24px; padding: 20px; }
.countdown .cell { border-radius: 16px; background: rgba(255,255,255,0.03); padding: 14px 6px; text-align: center; }
.countdown .num { font-family: var(--serif); font-size: clamp(22px, 5vw, 32px); color: #fff; font-variant-numeric: tabular-nums; }
.countdown .lbl { margin-top: 6px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(196,181,253,0.6); }
.no-date { display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 380px; margin: 40px auto 0; font-size: 14px; line-height: 1.65; color: rgba(221,214,254,0.7); text-align: center; }
.city-label { font-family: var(--sans); font-size: 14px; fill: #EDE9FE; }

/* ── Финал ───────────────────────────────────────────────── */
.finale {
  position: relative; z-index: 10; min-height: 100svh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 96px 24px; overflow: hidden;
}
.finale::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(4,6,15,0.7) 100%);
}
.finale-inner { position: relative; z-index: 2; max-width: 620px; }
.finale h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 6vw, 56px); color: #fff; margin: 0; }
.finale .f-sub { margin: 24px auto 0; max-width: 500px; font-size: 15px; line-height: 1.7; color: rgba(221,214,254,0.85); }
.heart-btn-wrap { position: relative; margin-top: 48px; display: inline-block; }
.heart-btn {
  position: relative; width: 96px; height: 96px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid rgba(249,168,212,0.4); background: rgba(249,168,212,0.1);
  box-shadow: 0 0 60px rgba(249,168,212,0.3); font-size: 38px;
  transition: transform 0.3s, box-shadow 0.3s;
}
.heart-btn:hover { transform: scale(1.05); box-shadow: 0 0 90px rgba(249,168,212,0.5); }
.heart-btn::after {
  content: ""; position: absolute; inset: 0; border-radius: 999px; background: rgba(249,168,212,0.1);
  animation: ping-ring 2s cubic-bezier(0,0,0.2,1) infinite;
}

const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);

/* ── Звёздное небо (canvas) ─────────────────────────────────────────────── */
function initStarfield(canvas) {
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const density = parseFloat(canvas.dataset.density || "1");
  const COLORS = ["#FFFFFF", "#FBCFE8", "#DDD6FE", "#FDE68A"];
  let stars = [], raf = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.floor((w * h) / 9000 * density);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.4 + 0.3, p: Math.random() * Math.PI * 2,
      s: Math.random() * 0.9 + 0.35,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
    }));
  }

  function draw(t) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    for (const st of stars) {
      ctx.globalAlpha = REDUCED ? 0.8 : 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(st.p + t * 0.001 * st.s));
      ctx.fillStyle = st.c;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!REDUCED) raf = requestAnimationFrame(draw);
  }

  resize(); raf = requestAnimationFrame(draw);
  new ResizeObserver(resize).observe(canvas);
}
document.querySelectorAll(".starfield").forEach(initStarfield);

/* ── Парящие сердечки ───────────────────────────────────────────────────── */
(function () {
  const wrap = $("bg-hearts");

  cfg.forEach((h) => {
    const el = document.createElement("span");

    el.textContent = "❤";

    el.style.fontSize = h.size + "px";
    el.style.animationDuration = h.duration + "s";
    el.style.animationDelay = h.delay + "s";

  });
})();

/* ── Появление блоков при прокрутке ─────────────────────────────────────── */
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
}, { margin: "-80px" });
document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

/* ── Модальное окно ─────────────────────────────────────────────────────── */
const modalOverlay = $("modal-overlay"), modalBox = $("modal-box"), modalContent = $("modal-content");
let lastFocused = null;

function openModal(html, label) {
  lastFocused = document.activeElement;
  modalContent.innerHTML = html;
  modalOverlay.setAttribute("aria-label", label);
  modalOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
  modalBox.focus();
}
function closeModal() {
  modalOverlay.classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocused) lastFocused.focus();
}
$("modal-close").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (modalOverlay.classList.contains("open")) closeModal();

    setTimeout(() => intro.remove(), 1000);
  }
  $("intro-cta").addEventListener("click", finish);
  $("intro-skip").addEventListener("click", finish);
  window.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.getElementById("intro")) finish(); });
  document.body.style.overflow = "hidden";
})();

/* ── Главный экран ──────────────────────────────────────────────────────── */
$("hero-eyebrow").textContent = "только для тебя, " + GIFT.herName;
$("hero-title").textContent = GIFT.hero.title;
$("hero-subtitle").textContent = GIFT.hero.subtitle;
$("hero-greeting").textContent = GIFT.hero.greeting;

/* ── Почему именно ты ───────────────────────────────────────────────────── */
(function () {
  const grid = $("reasons-grid");
  GIFT.reasons.forEach((r, i) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card glass reveal";
    card.style.transitionDelay = (i * 0.05) + "s";
    card.setAttribute("aria-expanded", "false");
    card.innerHTML =
      '<span class="card-icon" aria-hidden="true">❤</span>' +
      "<h3></h3>" +
      '<div class="detail"></div>' +
      '<span class="hint">нажми, чтобы раскрыть</span>';
    card.querySelector("h3").textContent = r.title;
    card.querySelector(".detail").textContent = r.detail;
    card.addEventListener("click", () => {
      const open = card.classList.toggle("open");
      card.setAttribute("aria-expanded", String(open));
      card.querySelector(".hint").textContent = open ? "нажми, чтобы закрыть" : "нажми, чтобы раскрыть";
    });
    grid.appendChild(card);
    io.observe(card);
  });
})();

/* ── История ────────────────────────────────────────────────────────────── */
(function () {
  const tl = $("timeline");
  GIFT.story.forEach((ev, i) => {
    const item = document.createElement("div");
    item.className = "tl-item reveal";
    item.style.transitionDelay = (i * 0.05) + "s";
    item.innerHTML =
      '<span class="tl-dot" aria-hidden="true"></span>' +
      '<button type="button" class="tl-card glass">' +
        '<p class="tl-date"><span class="d"></span></p>' +
        "<h3></h3><p class=\"t\"></p>" +
      "</button>";
    item.querySelector(".d").textContent = ev.date;
    item.querySelector("h3").textContent = ev.title;
    item.querySelector(".t").textContent = ev.text;
    item.querySelector("button").addEventListener("click", () => {
      openModal(
        '<p class="m-eyebrow">🗓 <span></span></p>' +
        "<h3></h3>" + photo + '<p class="m-text"></p>',
        ev.title
      );
      const m = modalContent;
      m.querySelector(".m-eyebrow span").textContent = ev.date;
      m.querySelector("h3").textContent = ev.title;
      m.querySelector(".m-text").textContent = ev.text;
    });
    tl.appendChild(item);
    io.observe(item);
  });
})();

/* ── Письма ─────────────────────────────────────────────────────────────── */
(function () {
  const grid = $("letters-grid");
  GIFT.letters.forEach((letter, i) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card glass letter-card reveal";
    card.style.transitionDelay = (i * 0.05) + "s";
    card.innerHTML =
      '<span class="letter-emoji" aria-hidden="true"></span>' +
      "<h3></h3>" +
      '<span class="hint">нажми, чтобы открыть письмо</span>';
    card.querySelector(".letter-emoji").textContent = letter.emoji;
    card.querySelector("h3").textContent = letter.title;
    card.addEventListener("click", () => {
      const paragraphs = letter.text.split("\n\n")
        .map((p) => "<p></p>").join("");
      openModal(
        '<span class="seal" aria-hidden="true"></span>' +
        "<h3></h3>" +
        '<div class="letter-body">' + paragraphs + "</div>" +
        '<p class="letter-sign">твой<span></span></p>',
        letter.title
      );
      const m = modalContent;
      m.querySelector(".seal").textContent = letter.emoji;
      m.querySelector("h3").textContent = letter.title;
      m.querySelectorAll(".letter-body p").forEach((p, idx) => {
        p.textContent = letter.text.split("\n\n")[idx];
      });
      m.querySelector(".letter-sign span").textContent = GIFT.hisName;
    });
    grid.appendChild(card);
    io.observe(card);
  });
})();

/* ── Сюрприз ────────────────────────────────────────────────────────────── */
const surpriseOverlay = $("surprise-overlay");
let surprisePopulated = false;

function populateSurprise() {
  if (surprisePopulated) return;
  surprisePopulated = true;
  // Светящиеся частицы
  for (let i = 0; i < 34; i++) {
    const p = document.createElement("span");
    p.className = "particle";
    const size = 1.5 + Math.random() * 2.5;
    p.style.width = p.style.height = size + "px";
    p.style.left = (50 + (Math.random() - 0.5) * 90) + "%";
    p.style.top = (50 + (Math.random() - 0.5) * 80) + "%";
    p.style.background = Math.random() > 0.5 ? "#C4B5FD" : "#F9A8D4";
    surpriseOverlay.appendChild(p);
    if (!REDUCED) {
      p.animate(
        [
          { opacity: 0, transform: "scale(0.4)" },
          { opacity: 0.9, transform: "scale(1)" },
          { opacity: 0, transform: "scale(0.6)" },
        ],
        { duration: 2200 + Math.random() * 2200, delay: Math.random() * 800, iterations: Infinity, easing: "ease-in-out" }
      );
    } else {
      p.style.opacity = "0.6";
    }
  }
  // Разлетающиеся сердечки
  for (let i = 0; i < 12; i++) {
    const h = document.createElement("span");
    h.className = "p-heart";
    h.textContent = "❤";
    const size = 14 + Math.random() * 14;
    h.style.fontSize = size + "px";
    h.style.left = "50%"; h.style.top = "50%";
    surpriseOverlay.appendChild(h);
    if (!REDUCED) {
      const angle = (i / 12) * Math.PI * 2;
      const dist = 120 + Math.random() * 110;
      h.animate(
        [
          { opacity: 0, transform: "translate(-50%,-50%) scale(0.3) rotate(0deg)" },
          { opacity: 1, transform: "translate(-50%,-50%) scale(1) rotate(" + (angle > Math.PI ? -18 : 18) + "deg)", offset: 0.25 },
          { opacity: 0, transform: "translate(calc(-50% + " + Math.cos(angle) * dist + "px), calc(-50% + " + (Math.sin(angle) * dist * 0.7 - 50) + "px)) scale(0.7) rotate(" + (angle > Math.PI ? -30 : 30) + "deg)" },
        ],
        { duration: 2400, delay: 250 + Math.random() * 500, easing: "ease-out", fill: "forwards" }
      );
    }
  }
}

function openSurprise() {
  $("surprise-msg").textContent = GIFT.surprise.message;
  $("surprise-sign").textContent = "- " + GIFT.hisName;
  populateSurprise();
  surpriseOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeSurprise() {
  surpriseOverlay.classList.remove("open");
  document.body.style.overflow = "";
}
$("secret-btn-text").textContent = GIFT.surprise.button;
$("secret-btn").addEventListener("click", openSurprise);
$("surprise-back").addEventListener("click", closeSurprise);

/* ── Расстояние ─────────────────────────────────────────────────────────── */
(function () {
  const d = GIFT.distance;
  if (!d.enabled) { $("distance").style.display = "none"; return; }
  $("city-a-label").textContent = d.cityA;
  $("city-b-label").textContent = d.cityB;
  $("distance-note").textContent = d.note;
  const wrap = $("distance-countdown-wrap");

  if (!d.meetingDate) {
    wrap.innerHTML = '<p class="no-date">✨ <span></span></p>';
    wrap.querySelector("span").textContent = d.noDateLine;
    return;
  }

  wrap.innerHTML =
    '<div class="countdown glass">' +
      ["дней", "часов", "минут", "секунд"].map((l) =>
        '<div class="cell"><div class="num">0</div><div class="lbl">' + l + "</div></div>"
      ).join("") +
    "</div>";
  const nums = wrap.querySelectorAll(".num");

  function tick() {
    const diff = Math.max(0, new Date(d.meetingDate).getTime() - Date.now());
    if (diff === 0) {
      wrap.innerHTML = '<p class="no-date">Этот день наступил ❤️</p>';
      clearInterval(timer);
      return;
    }
    nums[0].textContent = Math.floor(diff / 86400000);
    nums[1].textContent = Math.floor(diff / 3600000) % 24;
    nums[2].textContent = Math.floor(diff / 60000) % 60;
    nums[3].textContent = Math.floor(diff / 1000) % 60;
  }
  const timer = setInterval(tick, 1000);
  tick();
})();

/* ── Финал ──────────────────────────────────────────────────────────────── */
(function () {
  $("finale-line1").textContent = GIFT.finale.line1;
  $("finale-line2").textContent = GIFT.finale.line2;
  $("heart-btn-label").textContent = GIFT.finale.cta;
  $("finale-final").textContent = GIFT.finale.final;
  $("footer-name").textContent = GIFT.hisName;

  const wrap = document.querySelector(".heart-btn-wrap");
  $("heart-btn").addEventListener("click", function () {
    $("finale-final").classList.add("shown");
    if (REDUCED) return;
    for (let i = 0; i < 12; i++) {
      const h = document.createElement("span");
      h.className = "p-heart";
      h.textContent = "❤";
      h.style.position = "absolute";
      h.style.left = "50%"; h.style.top = "50%";
      h.style.fontSize = (14 + (i % 3) * 4) + "px";
      wrap.appendChild(h);
      const angle = (i / 12) * Math.PI * 2;
      const dist = 90 + (i % 3) * 35;
      const anim = h.animate(
        [
          { opacity: 1, transform: "translate(-50%,-50%) scale(0.4)" },
          { opacity: 0, transform: "translate(calc(-50% + " + Math.cos(angle) * dist + "px), calc(-50% + " + (Math.sin(angle) * dist - 30) + "px)) scale(1.1) rotate(" + Math.cos(angle) * 40 + "deg)" },
        ],
        { duration: 1600, easing: "ease-out" }
      );
      anim.onfinish = () => h.remove();
    }
  });
})();
</script>
